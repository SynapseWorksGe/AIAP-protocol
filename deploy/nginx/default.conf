##############################################################################
# Nginx reverse proxy — маршрутизация микросервисов по путям
#
# Добавление нового сервиса:
#   1. Скопировать блок location
#   2. Заменить /aiap/ на /новый-путь/
#   3. Заменить upstream на имя контейнера:порт
#   4. nginx -s reload  (или docker compose restart nginx)
##############################################################################

server {
    listen 80;
    server_name _;

    client_max_body_size 500M;

    # ── Корневая страница — список сервисов ──────────────────────────────
    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>VPS Services</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:600px;margin:80px auto;padding:0 20px;color:#1e293b}
  h1{font-size:24px;margin-bottom:24px}
  a{display:block;padding:14px 20px;margin:8px 0;background:#f8fafc;border:1px solid #e2e8f0;
    border-radius:8px;text-decoration:none;color:#4f46e5;font-weight:500;transition:all .2s}
  a:hover{background:#eef2ff;border-color:#4f46e5}
  span{color:#64748b;font-weight:400;font-size:14px}
</style></head><body>
<h1>Services</h1>
<a href="/aiap/">AIAP Meeting Protocol <span>— расшифровка встреч</span></a>
<!-- <a href="/service2/">Service 2 <span>— описание</span></a> -->
</body></html>';
    }

    # ── AIAP Meeting Protocol (/aiap/) ───────────────────────────────────
    location /aiap/ {
        proxy_pass http://aiap-protocol:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── Пример: Service 2 (/service2/) ──────────────────────────────────
    # location /service2/ {
    #     proxy_pass http://service2:8001/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
